apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd
  template:
    metadata:
      labels:
        app: argocd
    spec:
      containers:
      - name: argocd-server
        image: cr.yandex/mirror/nginx:alpine
        ports:
        - containerPort: 80
