version: '3.8'

services:
  s3:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: mlops_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"

  mlflow:
    image: cr.yandex/mirror/mlflow/mlflow:latest
    container_name: mlops_mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
    command: mlflow server --host 0.0.0.0 --artifacts-destination s3://mlflow/ --default-artifact-root s3://mlflow/
    depends_on:
      - s3
